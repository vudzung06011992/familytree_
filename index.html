<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>basic-tree-1</title>
  <link rel="shortcut icon" type="image/svg" href="./examples/logo.svg">
  <script src="https://unpkg.com/d3@6"></script>
  <link rel="stylesheet" href="./src/styles/family-chart.css">
  
  <!-- CSS compact header for ngrok deployment -->
  <style>
    /* Compact header - bao khít nhưng giữ 2 dòng riêng biệt */
    body > div:first-of-type {
      padding: 4px 10px !important;     /* Minimal padding */
      background: #222 !important;
      text-align: center !important;
    }
    
    /* Buttons trên dòng riêng */
    #selectFileBtn, #loadBtn {
      padding: 4px 8px !important;      /* Compact buttons */
      font-size: 12px !important;       
      margin: 1px 3px !important;       /* Minimal margin */
      display: inline-block !important;
    }
    
    /* Status text dòng riêng, compact */
    #status {
      display: block !important;        /* Dòng riêng biệt */
      margin: 3px 0 0 0 !important;     /* Chỉ có margin top nhỏ */
      font-size: 11px !important;       /* Nhỏ font */
      line-height: 1 !important;        /* Không line height thừa */
    }
  </style>
</head>
<body>
  
  <!-- Khu vực chọn file và nút upload -->
  <div style="padding: 20px; background: #222; text-align: center;">
    <!-- Nút chọn file giống với nút Load -->
    <button id="selectFileBtn" style="padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer; margin-right: 10px;">
      Chọn File Excel
    </button>

    <button id="loadBtn" style="padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer;">
      Hiển thị cây gia phả
    </button>

    <!-- Input file bị ẩn -->
    <input type="file" id="fileInput" accept=".xlsx,.xlsm" style="display: none;">

    <p id="status" style="color: #fff; margin-top: 10px;"></p>
  </div>

  <!-- Vùng hiển thị cây -->
  <div id="FamilyChart" class="f3"
     style="width:100%;height:100%;
            position:absolute;top:0;left:0;
            margin:0;padding:0;
            background-image: url('beach.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color:#fff;
            z-index: -1;">
  </div>

  <!-- Script xử lý upload và vẽ lại cây -->
  <script type="module">
    // Cấu hình API endpoint - sẽ tự động detect environment
    const getApiUrl = () => {
      // Production trên Vercel
      if (window.location.hostname.includes('vercel.app')) {
        return 'https://familytree-production-xxxx.up.railway.app'; // Thay xxxx bằng Railway URL thực tế
      }
      // Nếu đang chạy với ngrok (tunnel)
      if (window.location.hostname.includes('ngrok')) {
        return 'http://127.0.0.1:5000'; // Local server
      }
      // Nếu đang chạy local development
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return 'http://127.0.0.1:5000';
      }
      // Fallback production
      return 'https://familytree-production-xxxx.up.railway.app'; // Thay xxxx bằng Railway URL thực tế
    };

    const API_BASE = getApiUrl();
    
    const status = document.getElementById('status');
    const loadBtn = document.getElementById('loadBtn');
    const selectFileBtn = document.getElementById('selectFileBtn');
    const fileInput = document.getElementById('fileInput');

    // Gán sự kiện click cho nút chọn file
    selectFileBtn.addEventListener('click', () => {
      fileInput.click();
    });

    loadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('Vui lòng chọn file Excel');
        return;
      }

      status.innerText = "📤 Đang upload file...";
      Object.assign(status.style, {
        fontFamily: "Arial",
        fontSize: "12px"
      });
      const formData = new FormData();
      formData.append('file', file);

      try {
        // Upload file Excel lên server
        await fetch(`${API_BASE}/upload`, {
          method: 'POST',
          body: formData
        });

        // Gọi API để lấy dữ liệu cây đã xử lý
        const response = await fetch(`${API_BASE}/api/family`);
        if (!response.ok) throw new Error("Lỗi khi lấy dữ liệu");

        const data = await response.json();
        
        // Xoá cây hiện tại
        document.getElementById('FamilyChart').innerHTML = '';

        // Thay vì reload script, gọi function trực tiếp với data
        try {
          // Thử method 1: dynamic import
          try {
            const { default: createChart } = await import(`./index.js?t=${Date.now()}`);
            if (typeof createChart === 'function') {
              createChart(data); // Truyền data trực tiếp
            }
            status.innerText = "Cây gia phả đã được tải thành công!";
          } catch (importError) {
            console.warn('Dynamic import failed, trying fetch method:', importError);
            
            // Method 2: Fetch và eval (fallback cho ngrok)
            const response = await fetch(`./index.js?t=${Date.now()}`);
            const jsCode = await response.text();
            
            // Create a script blob với đúng MIME type
            const blob = new Blob([jsCode], { type: 'application/javascript' });
            const scriptUrl = URL.createObjectURL(blob);
            
            const script = document.createElement('script');
            script.type = 'module';
            script.src = scriptUrl;
            
            script.onload = () => {
              status.innerText = "Cây gia phả đã được tải thành công!";
              URL.revokeObjectURL(scriptUrl); // Clean up
            };
            
            script.onerror = (err) => {
              console.error('Script blob failed:', err);
              status.innerText = "❌ Lỗi khi tải script.";
              URL.revokeObjectURL(scriptUrl);
            };
            
            document.head.appendChild(script);
          }
          
          status.style.fontFamily = "Arial";
          status.style.fontSize = "12px";
        } catch (err) {
          console.error('❌ Lỗi khi tải script:', err);
          status.innerText = "❌ Lỗi khi tải script: " + err.message;
        }

      } catch (error) {
        console.error('❌ Lỗi:', error);
        alert('Đã xảy ra lỗi khi xử lý cây.');
        status.innerText = "❌ Lỗi khi xử lý dữ liệu.";
      }
    });
  </script>
</body>
</html>
